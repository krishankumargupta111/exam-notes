apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-notes-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: exam-notes-backend
  template:
    metadata:
      labels:
        app: exam-notes-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8000
