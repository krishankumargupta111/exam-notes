
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exam-notes-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: exam-notes-frontend
  template:
    metadata:
      labels:
        app: exam-notes-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          env:
            - name: VITE_FIREBASE_APIKEY
              valueFrom:
                secretKeyRef:
                  name: exam-notes-frontend-secret
                  key: VITE_FIREBASE_APIKEY

            - name: VITE_API_URL
              valueFrom:
                secretKeyRef:
                  name: exam-notes-frontend-secret
                  key: VITE_API_URL

